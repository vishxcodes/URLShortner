<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VishURL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #e5e5e5;
    }

    body.dark {
      --bg: #0f0f0f;
      --text: #f5f5f5;
      --border: #333333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s ease;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
    }

    h1 {
      font-size: 42px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    p {
      font-size: 16px;
      opacity: 0.7;
      margin-bottom: 40px;
    }

    .btn {
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid var(--text);
      background: var(--text);
      color: var(--bg);
      cursor: pointer;
      transition: 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .toggle:hover {
      background: var(--text);
      color: var(--bg);
    }
  </style>
</head>

<body>

  <div class="toggle" onclick="toggleDarkMode()">Toggle Mode</div>

  <div class="container">
    <h1>VishURL</h1>
    <p>Simple. Fast. Minimal URL shortening service.</p>
    <a href="/app" class="btn">Get Started</a>
  </div>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
